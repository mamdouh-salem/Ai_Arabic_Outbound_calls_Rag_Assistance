[project]
name = "outbound-ai"
version = "0.1.0"
description = "Arabic AI-powered outbound follow-up calls with multi-agent routing and a RAG knowledge assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # --- Orchestration (LangGraph) ---
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",

    # --- Agent harness (LangChain) ---
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",

    # --- Observability ---
    "langsmith>=0.1.140",

    # --- Backend ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # --- UI ---
    "gradio>=5.0.0",

    # --- Database (Supabase / Postgres + pgvector) ---
    "supabase>=2.9.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.6",

    # --- Voice: STT (Whisper) + TTS (ElevenLabs) ---
    "openai>=1.55.0",
    "elevenlabs>=1.13.0",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "webrtcvad-wheels>=2.0.14",
    "numpy>=1.26.0",

    # --- RAG ---
    "rank-bm25>=0.2.2",
    "tiktoken>=0.8.0",

    # --- Core ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "jinja2>=3.1.4",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
# Local cross-encoder reranker. Optional: the default reranker is LLM-based,
# so this is only needed if we switch rag/rerank.py to the local model.
rerank = [
    "sentence-transformers>=3.3.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outbound_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
